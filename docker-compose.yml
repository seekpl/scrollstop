# Przykład wdrożenia trybu serwerowego (§21.1). Sekrety (Stripe, AI) podawaj w pliku .env, nie w repozytorium.
services:
  app:
    build: .
    image: scrollstop
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      APP_URL: ${APP_URL:-http://localhost:8787/}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-1024}
      # Płatności (puste = zamówienie e-mailem) i panel — wartości tylko w .env.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_CREATOR_MONTHLY: ${STRIPE_PRICE_CREATOR_MONTHLY:-}
      STRIPE_PRICE_CREATOR_YEARLY: ${STRIPE_PRICE_CREATOR_YEARLY:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-0}
      PANEL_SALT: ${PANEL_SALT:-}
      # Rekomendacje AI (puste = wnioski z reguł).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
    volumes:
      - scrollstop-data:/data
volumes:
  scrollstop-data:
